# ~/.config/hypr/hypridle.conf
# hypridle still uses hyprlang; only hyprland itself moved to lua.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                          # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn the screen on without a key press after resume.
}

listener {
    timeout = 300                              # 5 min — run screensaver
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 900                              # 15 min — fully lock session (adjust if you want sooner)
    on-timeout = loginctl lock-session
}
